{% extends "base.html" %}
{% block content %}
<div class="container channels">
  <div class="head">
    <div class="title">
      <h1 style="display: inline-block;">Categories</h1>
    </div>
    <div>
      <div>
        <select name="sort" class="sort" oninput="channelSort()">
          <option value="videos-" selected>Most videos</option>
          <option value="videos-a">Fewest videos</option>
          <option value="search-a">Name (asc)</option>
          <option value="search-">Name (desc)</option>
        </select>
        <input type="text" class="search" oninput="channelSearch()" placeholder="Search...">
      </div>
    </div>
  </div>
  <div class="channels flex-grid">
    {% for cat in categories %}
    <div class="card searchable" data-search="{{ cat.name }}" data-videos="{{ cat.videos_count }}">
      <a href="{{ web_root }}categories/{{ cat.slug }}{{ html_ext }}" class="inner">
        <div class="content">
          <div class="title">{{ cat.name }}</div>
          <div class="description">{{ cat.videos_count }} videos</div>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
